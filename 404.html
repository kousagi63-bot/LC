<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Stackly</title>
  <meta name="description" content="The page you are looking for could not be found. Return to Stackly." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
  <style>
    .error-page { position: relative; background-image:url('assets/img/error.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .error-page::before { content: ''; position: absolute; inset: 0; background: rgba(12, 21, 36, 0.65); }
    .error-page > .container { position: relative; z-index: 1; }
  </style>
</head>
<body>

  <!-- 404 Content -->
  <section class="section-padding text-center error-page" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container">
      <div class="mb-4" data-aos="fade-up">
        <img src="assets/img/logo.webp" alt="Stackly" style="height:clamp(56px, 10vw, 76px);width:auto;display:block;margin:0 auto;filter:brightness(0) saturate(100%) invert(58%) sepia(28%) saturate(380%) hue-rotate(-5deg);" />
      </div>
      <div class="display-heading" style="font-size:clamp(5rem, 16vw, 11rem);line-height:1;color:var(--gold);" data-aos="fade-up">404</div>
      <h1 class="section-title mt-3" style="color:var(--white);">Page Not Found</h1>
      <p class="section-subtitle mx-auto mt-3" style="color:rgba(255,255,255,0.9);max-width:560px;" data-aos="fade-up">The page you're looking for may have been moved, renamed, or never existed. Let's get you back on solid ground.</p>
      <div class="d-flex flex-wrap justify-content-center gap-3 mt-4" data-aos="fade-up">
        <a href="index.html" class="btn btn-gold btn-lg"><i class="fa-solid fa-house me-2"></i>Back to Home</a>
        <a href="javascript:history.back()" class="btn btn-outline-light btn-lg"><i class="fa-solid fa-arrow-left me-2"></i>Go Back</a>
      </div>
      <div class="mt-5" data-aos="fade-up">
        <p style="font-size:0.82rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.75);margin-bottom:1rem;">Popular Pages</p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <a href="practice-areas.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Practice Areas</a>
          <a href="team.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Our Team</a>
          <a href="insights.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Insights</a>
          <a href="careers.html" class="badge-gold" style="padding:0.6rem 1.2rem;">Careers</a>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/split-type@0.3.4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
